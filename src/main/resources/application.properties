# FestPass Application Configuration
server.port=8080
spring.application.name=festpass-backend

# MySQL Database Configuration
# Read from environment variables DB_URL, DB_USERNAME, DB_PASSWORD with local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/festpass?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:S5nur@nu02}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for Local Development
# ddl-auto=update automatically creates and updates tables/columns while preserving existing records
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SpringDoc / Swagger UI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
